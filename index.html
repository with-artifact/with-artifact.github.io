<!doctype html>
<html lang="en" class="h-full bg-zinc-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>With Artifact</title>
    <meta name="description" content="Make lasting artifacts" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://withartifact.io/" />

    <!-- Open Graph -->
    <meta property="og:title" content="With Artifact" />
    <meta property="og:description" content="Make lasting artifacts" />
    <meta
      property="og:image"
      content="https://withartifact.io/assets/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#09090b" />

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="h-full text-zinc-100 antialiased">
    <!-- Page wrapper, a flex column that keeps the footer at the bottom -->
    <div class="flex min-h-full flex-col outline outline-zinc-950">
      <!-- Hero Section -->
      <main
        class="flex flex-1 flex-col justify-center px-6 py-12 outline outline-zinc-950"
      >
        <div class="mx-auto w-full max-w-2xl outline outline-zinc-950">
          <!-- Logo -->
          <div class="flex justify-center">
            <svg
              class="h-28 w-auto text-zinc-100"
              width="159"
              height="112"
              viewBox="0 0 2117 1490"
              fill="currentColor"
              role="img"
              aria-label="With Artifact"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M0 1490 334 1490 735 0 401 0Z" />
              <path
                d="M686 1490 1023 1490 1134 1144 1210 905 1253 771 1287 659 1355 393 1392 239 1431 391 1503 657 1539 771 1584 905 1663 1144 1778 1490 2117 1490 1595 0 1195 0Z"
              />
            </svg>
          </div>

          <!-- Brand Text -->
          <div class="mt-12 text-center">
            <p class="text-2xl text-zinc-400">Make lasting artifacts</p>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="mt-auto outline outline-zinc-950">
        <div class="mx-auto max-w-7xl px-6 py-8">
          <!-- Social Links -->
          <nav class="flex flex-wrap justify-center gap-x-6 gap-y-2 text-sm">
            <a
              href="https://github.com/with-artifact"
              class="text-zinc-400 transition hover:text-zinc-100"
            >
              GitHub
            </a>
            <a
              href="https://x.com/withartifact"
              class="text-zinc-400 transition hover:text-zinc-100"
            >
              X
            </a>
            <a
              href="https://linkedin.com/company/withartifact"
              class="text-zinc-400 transition hover:text-zinc-100"
            >
              LinkedIn
            </a>
            <a
              href="mailto:hello@withartifact.io"
              class="text-zinc-400 transition hover:text-zinc-100"
            >
              Hello
            </a>
          </nav>

          <!-- Copyright -->
          <p class="mt-4 text-center text-sm text-zinc-500">
            ©2026 With Artifact LLC
          </p>
        </div>
      </footer>
    </div>
  </body>
</html>
